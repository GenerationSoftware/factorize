name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run required checks again against GitHub's speculative merge-queue commit.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify generated API contract
        run: |
          npm run generate
          git diff --exit-code -- packages/docs/openapi.yaml packages/api-client/src/schema.d.ts
      - run: npm run build:css
      - run: npm run check
