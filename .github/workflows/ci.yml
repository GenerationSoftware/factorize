name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run required checks again against GitHub's speculative merge-queue commit.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/postgres
    steps:
      # ubuntu-latest includes PostgreSQL; no rate-limited container pull is needed.
      - name: Start disposable runner PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'local-ci-only'"
          pg_isready -h localhost -p 5432
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify generated API contract
        run: |
          npm run generate
          git diff --exit-code -- packages/docs/openapi.yaml packages/api-client/src/schema.d.ts
      - name: Install browser for static application checks
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Upload visual comparison failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factorize-visual-failures
          path: packages/app/test-results
          if-no-files-found: ignore
      - name: Exercise compiled jobs/invocation/run slice against PostgreSQL
        run: npm run test:static-slice --workspace=factorize
