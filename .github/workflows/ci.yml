name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: Test and validate Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/factorize_ci
      QUEUE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/factorize_ci
      DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/factorize_ci
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Prepare isolated PostgreSQL database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'local-ci-only'"
          sudo -u postgres createdb factorize_ci
          pg_isready -h localhost -p 5432
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npm run db:migrate --workspace=factorize
      - name: Install Chromium
        run: npm exec --workspace=factorize-app -- playwright install --with-deps chromium
      - name: Run complete local validation
        run: npm test
