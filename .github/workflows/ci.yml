name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run required checks again against GitHub's speculative merge-queue commit.
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and validate Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run check
