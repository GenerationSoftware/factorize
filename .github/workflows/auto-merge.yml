name: Auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow intentionally does not check out or execute PR code.
      - name: Check whether the author has write access
        id: author-permission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          can_push=$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" \
            --jq '.user.permissions.push')

          echo "can-push=$can_push" >> "$GITHUB_OUTPUT"
          if [ "$can_push" != "true" ]; then
            echo "Skipping pull request: $PR_AUTHOR does not have write access."
          fi

      - name: Merge after required checks pass
        if: >-
          github.event.pull_request.draft == false &&
          steps.author-permission.outputs.can-push == 'true'
        env:
          # A fine-grained PAT or GitHub App token is required here. The built-in
          # GITHUB_TOKEN cannot add PRs to a merge queue and can suppress
          # downstream push-triggered workflows such as production deployment.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --merge "$PR_URL"
