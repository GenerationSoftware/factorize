name: Auto-merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  enqueue:
    name: Add pull request to merge queue
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # workflow_run executes from the default branch. Do not check out or run PR code.
      - name: Check whether the pull request is eligible
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          author=$(jq -r '.user.login' <<< "$pr")
          is_draft=$(jq -r '.draft' <<< "$pr")
          can_push=$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" \
            --jq '.user.permissions.push')

          eligible=false
          if [ "$is_draft" = "false" ] && [ "$can_push" = "true" ]; then
            eligible=true
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [ "$eligible" != "true" ]; then
            echo "Skipping pull request: draft=$is_draft, author-can-push=$can_push."
          fi

      - name: Add pull request to merge queue
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge
