name: Auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow intentionally does not check out or execute PR code.
      - name: Merge after required checks pass
        env:
          # A fine-grained PAT or GitHub App token is required here. The built-in
          # GITHUB_TOKEN cannot add PRs to a merge queue and can suppress
          # downstream push-triggered workflows such as production deployment.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          echo "Event author association: $EVENT_AUTHOR_ASSOCIATION"
          if [ "$PR_DRAFT" = "true" ]; then
            echo "Skipping draft pull request."
            exit 0
          fi

          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq '.user.permissions | .admin or .maintain or .push')
          if [ "$permission" != "true" ]; then
            echo "Skipping pull request from an author without write permission."
            exit 0
          fi

          gh pr merge --auto --merge "$PR_URL"
