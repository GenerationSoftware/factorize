                            required:
                              - user_id
                              - kind
                              - id
                            additionalProperties: false
                        required:
                          - reason
                          - reported_at
                          - reporter
                        additionalProperties: false
                      - type: "null"
                required:
                  - id
                  - job_id
                  - state
                  - execution_type
                  - run_name
                  - job_name
                  - destination_url
                  - created_at
                  - updated_at
                  - started_at
                  - artifact_state
                  - finalizing
                  - trace_revision
                  - failure_source
