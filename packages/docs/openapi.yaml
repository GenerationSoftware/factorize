  /api/v1/runs/{runId}/status:
    get:
      summary: Get lightweight run status
      description: |-
        Only bounded encrypted prompt/script previews are decrypted; full prompt, invocation context, artifacts, activity and diagnostics stay in the detail operation. Continue polling terminal runs while finalizing is true. trace_revision changes on generation transition or canonical projection/replay; live appends retain the revision. Full detail remains available at GET /runs/{runId}.

        Requires the runs:read scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  trigger_id:
                    type:
                      - string
                      - "null"
                  launch_skill_id:
                    anyOf:
                      - type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                      - type: "null"
                  launch_skill_key:
                    type:
                      - string
                      - "null"
                  launch_skill_revision:
                    anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: "null"
                  state:
                    type: string
                    enum:
                      - queued
                      - reserved
                      - starting
                      - running
                      - blocked
                      - stopping
                      - succeeded
                      - failed
                      - stopped
                  execution_type:
                    default: agent
                    type: string
                    enum:
                      - agent
                      - code
                  run_name:
                    type: string
                  trigger_name:
                    type:
                      - string
                      - "null"
                  destination_url:
                    type:
                      - string
                      - "null"
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  started_at:
                    type:
                      - string
                      - "null"
                  artifact_state:
                    type: string
                    enum:
                      - pending
                      - collecting
                      - stored
                      - partial
                      - failed
                  finalizing:
                    type: boolean
                  trace_revision:
                    type: string
                  failure_source:
                    anyOf:
                      - type: string
                        enum:
                          - system
                          - agent
                      - type: "null"
                  failure:
                    anyOf:
                      - type: object
                        properties:
                          source:
                            type: string
                            enum:
                              - run
                              - system
                          code:
                            type: string
                          reason:
                            type: string
                        required:
                          - source
                          - code
                          - reason
                        additionalProperties: false
                      - type: "null"
                  agent_error:
                    anyOf:
                      - type: object
                        properties:
                          reason:
                            type: string
                          reported_at:
                            type: string
                          reporter:
                            type: object
                            properties:
                              user_id:
                                type: string
                              kind:
                                type: string
                                enum:
                                  - api_key
                                  - oauth
                                  - session
                                  - run_token
                              id:
                                type: string
                            required:
                              - user_id
                              - kind
                              - id
                            additionalProperties: false
                        required:
                          - reason
                          - reported_at
                          - reporter
                        additionalProperties: false
                      - type: "null"
                required:
                  - id
                  - trigger_id
                  - state
                  - execution_type
                  - run_name
                  - trigger_name
                  - destination_url
                  - created_at
                  - updated_at
                  - started_at
                  - artifact_state
                  - finalizing
                  - trace_revision
                  - failure_source
                  - agent_error
                additionalProperties: false
