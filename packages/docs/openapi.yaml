  /api/v1/runs:
    post:
      summary: Start a Team run from an optional skill and prompt, or a script
      description: |-
        Supply a skill, a prompt, or images for an agent run. Script-based runs are retired. Skill frontmatter selects VM, permission and model presets; omitted selections inherit team defaults. Resolved preset revisions and the skill commit are snapshotted before queueing. Default scopes, integrations and invocation destinations are bounded by the caller's effective access. Explicit unauthorized permissions fail. Explicit empty selections grant none.

        Requires the runs:start scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "202":
          description: Accepted run
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  url:
                    type: string
                    format: uri
                  outcomeUri:
                    type: string
                  duplicate:
                    type: boolean
                required:
                  - runId
                  - url
                  - outcomeUri
                  - duplicate
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: post_api_v1_runs
      tags:
        - runs
      security:
        - bearerAuth: []
        - vendorRunIdentity: []
          runIdentityHeader: []
        - cookieAuth: []
      x-required-scope: runs:start
      x-owner-session-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vmPreset:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                permissionPreset:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                modelPreset:
                  type: string
                  maxLength: 120
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                attachments:
                  maxItems: 16
                  type: array
                  items:
                    type: object
                    properties:
                      artifactId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    required:
                      - artifactId
                    additionalProperties: false
                requiresVm:
                  type: boolean
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 50000
                script:
                  description: "Retired: returns scripts_retired. Use an agent skill to execute code."
                  deprecated: true
                  type: string
                  minLength: 1
                  maxLength: 200000
                skill:
                  type: string
                  minLength: 1
                  maxLength: 64
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                executionConfigId:
                  type: string
                  minLength: 1
                modelAccountId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                vmImage:
                  type: string
                  maxLength: 512
                  pattern: ^(?:(?:(?:[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*\/)?[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*(?:\/[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*)*(?::[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(?:@sha256:[a-f0-9]{64})?))?$
                model:
                  type: string
                  maxLength: 120
                runScopes:
                  description: Factorize application permissions to grant. Omission inherits effective client permissions and an empty list grants none.
                  maxItems: 13
                  type: array
                  items:
                    type: string
                    enum:
                      - team:read
                      - team:write
                      - triggers:read
                      - triggers:write
                      - runs:read
                      - runs:invoke
                      - runs:start
                      - runs:cancel
                      - runs:write
                      - integrations:read
                      - integrations:write
                      - skills:read
                      - skills:write
                integrationIds:
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                inputs:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 200
              additionalProperties: false
    get:
      summary: List runs
      description: |-
        Returns tenant-authorized runs. Trigger and state filters accept repeated values and match any selected value within each filter; filters are applied before cursor pagination. When sort is supplied, ordering is applied before cursor pagination; statuses sort lexically by their persisted state, missing values sort last, and ties use run ID. Without sort, queued, reserved, and starting runs come first, running runs second, and all other states last; each group is ordered by creation time descending, then run ID descending. The opaque default cursor includes the priority group and creation time. Legacy two-field cursors resume at their original chronological boundary. Run states can change between requests and move rows across groups; restart pagination from the first page after observing a state transition if a gap-free live view is needed.

        Requires the runs:read scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Paginated runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: get_api_v1_runs
      tags:
        - runs
      security:
        - bearerAuth: []
        - vendorRunIdentity: []
          runIdentityHeader: []
        - cookieAuth: []
      x-required-scope: runs:read
      x-owner-session-required: false
      parameters:
        - name: triggerId
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
              - minItems: 1
                maxItems: 100
                type: array
                items:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        - name: state
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - queued
                  - reserved
                  - starting
                  - running
                  - done
                  - blocked
                  - failed
                  - ignored
                  - succeeded
                  - stopping
                  - stopped
              - minItems: 1
                maxItems: 10
                type: array
                items:
                  type: string
                  enum:
                    - queued
                    - reserved
                    - starting
                    - running
                    - done
                    - blocked
                    - failed
                    - ignored
                    - succeeded
                    - stopping
                    - stopped
        - name: skillId
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
              - type: string
                const: none
        - name: contextQuery
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 50000
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - source
              - run
              - status
              - created
              - agent
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
  /api/v1/search:
    get:
      summary: Search skill names and run names
      description: |-
        Search skill names and run names only, using case-insensitive substring and PostgreSQL pg_trgm word matching. Exact names rank first, then prefixes, then other matches by similarity with deterministic ties. Results are tenant-scoped and limited to 100. Triggers, descriptions, instruction bodies, issue fields and trace content are excluded. Blank or punctuation-only queries return no results.

        Requires the skills:read and runs:read scopes.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - skill
                            - run
                        id:
                          type: string
                        title:
                          type: string
                        subtitle:
                          type: string
                        url:
                          type: string
                        source:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                                - skill
                                - run
                            label:
                              type: string
                            id:
                              type: string
                          required:
                            - kind
                            - label
                            - id
                          additionalProperties: false
                        match:
                          type: object
                          properties:
                            text:
                              type: string
                            ranges:
                              type: array
                              items:
                                type: object
                                properties:
                                  start:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  end:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                required:
                                  - start
                                  - end
                                additionalProperties: false
                          required:
                            - text
                            - ranges
                          additionalProperties: false
                      required:
                        - kind
                        - id
                        - title
                        - subtitle
                        - url
                        - source
                        - match
                      additionalProperties: false
                required:
                  - items
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: get_api_v1_search
      tags:
        - search
      security:
        - bearerAuth: []
        - vendorRunIdentity: []
          runIdentityHeader: []
        - cookieAuth: []
      x-required-scope: skills:read+runs:read
      x-owner-session-required: false
      parameters:
        - name: q
          in: query
          required: false
          schema:
            default: ""
            type: string
