        First request omits revision and uses after=0. Subsequent requests supply the returned revision. A changed generation or canonical projection returns reset=true and events from zero in the new revision, from one database snapshot. Discard all cached old pages before merging the response. nextCursor=null means caught up, not finalized; poll after the last sequence while active/finalizing. Legacy GET /trace remains unchanged.

        Requires the runs:read scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Revision-bound page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        id:
                          type: string
                        parentId:
                          type: string
                        type:
                          type: string
                          enum:
                            - user_message
                            - assistant_message
                            - reasoning
                            - tool_call
                            - tool_result
                            - command
                            - file_change
                            - compaction
                            - branch
                            - usage
                            - warning
                            - error
                            - metadata
                        role:
                          type: string
                        title:
                          type: string
                        preview:
                          type: string
                        occurredAt:
                          type: string
                        display:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                      required:
                        - sequence
                        - id
                        - type
                        - title
                        - preview
                        - display
                      additionalProperties: false
                  nextCursor:
                    anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: "null"
                  previousCursor:
                    anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: "null"
                  revision:
                    type: string
                  reset:
                    type: boolean
                required:
                  - items
                  - nextCursor
                  - revision
                  - reset
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: get_api_v1_runs_runId_trace_pages
      tags:
        - runs
      security:
        - bearerAuth: []
        - vendorRunIdentity: []
          runIdentityHeader: []
        - cookieAuth: []
      x-required-scope: runs:read
      x-owner-session-required: false
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        - name: after
          in: query
          required: false
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - name: recent
          in: query
          required: false
          schema:
            default: false
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 200
        - name: revision
          in: query
          required: false
          schema:
            type: string
            maxLength: 1000
