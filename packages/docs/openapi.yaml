  /api/v1/trigger-summaries:
    get:
      summary: List bounded trigger summaries
      description: |-
        Additive bounded list representation. Omitted sort preserves immutable UUID descending; updated preserves updated time descending with UUID descending ties. active sorts triggers with live runs first, then name and UUID ascending; running sorts numeric live-run counts in direction with name and UUID ascending ties; title sorts name in direction with UUID ascending ties. Name ordering uses the PostgreSQL en-US ICU collation. Non-ID sorts return opaque cursors bound to their sort and direction; keep filters and sort unchanged between pages. Live run-count changes can move triggers between pages. Literal case-insensitive name/slug search. No prompts or event configuration; statistics are batched. Existing GET /triggers remains an array.

        Requires the triggers:read scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Summary page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                        name:
                          type: string
                        enabled:
                          type: boolean
                        model:
                          type: string
                        effort:
                          type: string
                        agentKind:
                          type: string
                        executionType:
                          type: string
                          enum:
                            - agent
                            - code
                        concurrencyLimit:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        runningCount:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        lastRunState:
                          anyOf:
                            - type: string
                              enum:
                                - queued
                                - reserved
                                - starting
                                - running
                                - blocked
                                - stopping
                                - succeeded
                                - failed
                                - stopped
                                - done
                                - ignored
                            - type: "null"
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - name
                        - enabled
                        - model
                        - effort
                        - agentKind
                        - executionType
                        - concurrencyLimit
                        - runningCount
                        - lastRunState
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - items
                  - nextCursor
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: get_api_v1_trigger_summaries
      tags:
        - trigger-summaries
      security:
        - bearerAuth: []
        - vendorRunIdentity: []
          runIdentityHeader: []
        - cookieAuth: []
      x-required-scope: triggers:read
      x-owner-session-required: false
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            default: 30
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: q
          in: query
          required: false
          schema:
            default: ""
            type: string
            maxLength: 120
        - name: enabled
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - updated
              - active
              - running
              - title
        - name: direction
