    post:
      summary: Report an error for an active run
      description: |-
        Records a sanitized reason and authenticated reporter without changing run execution or releasing its concurrency slot. The agent may continue work and should then exit normally. An identical retry succeeds; a different replacement reason returns 409. Terminal runs reject reports.

        Requires the runs:write scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Report saved or identical retry acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  reported:
                    type: boolean
                    const: true
                  reason:
                    type: string
                  retry:
                    type: boolean
                required:
                  - reported
                  - reason
                  - retry
                additionalProperties: false
