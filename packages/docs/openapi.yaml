paths:
  /api/v1/session:
    get:
      summary: Get current browser session
      description: Cookie-only browser operation. Mutations require an exact app Origin and reject cross-site requests. Authorization headers are rejected. Responses are never cached.
      responses:
        "200":
          description: Unauthenticated sessions return authenticated:false; expired, unverified, removed or revoked owners are unauthenticated.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      authenticated:
                        type: boolean
                        const: false
                    required:
                      - authenticated
                    additionalProperties: false
                  - type: object
                    properties:
                      authenticated:
                        type: boolean
                        const: true
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                            format: email
                            pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                        required:
                          - id
                          - email
                        additionalProperties: false
                      workspace:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type:
                              - string
                              - "null"
                          role:
                            type: string
                            const: owner
                        required:
                          - id
                          - name
                          - role
                        additionalProperties: false
                      capabilities:
                        type: array
                        items:
                          type: string
                          enum:
                            - flows:read
                            - flows:write
                            - runs:read
                            - runs:write
                      expiresAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - authenticated
                      - user
                      - workspace
                      - capabilities
                      - expiresAt
                    additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: get_api_v1_session
      tags:
        - session
      security: []
      x-browser-auth-operation: session
      x-owner-session-required: false
  /api/v1/auth/login:
    post:
      summary: Sign in
      description: Cookie-only browser operation. Mutations require an exact app Origin and reject cross-site requests. Authorization headers are rejected. Responses are never cached.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  returnTo:
                    type: string
                required:
                  - ok
                  - returnTo
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: post_api_v1_auth_login
      tags:
        - auth
      security: []
      x-browser-auth-operation: login
      x-owner-session-required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 320
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 200
                  writeOnly: true
                returnTo:
                  type: string
                  maxLength: 4096
              required:
                - email
                - password
              additionalProperties: false
  /api/v1/auth/signup:
    post:
      summary: Request signup; existing accounts return the same accepted response
      description: Cookie-only browser operation. Mutations require an exact app Origin and reject cross-site requests. Authorization headers are rejected. Responses are never cached.
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
