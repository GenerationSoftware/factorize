                        maximum: 9007199254740991
                      - type: "null"
                  project_id:
                    type: string
                  project_name:
                    type: string
                  state:
                    type: string
                    enum:
                      - queued
                      - reserved
                      - starting
                      - running
                      - blocked
                      - stopping
                      - succeeded
                      - failed
                      - stopped
                  execution_type:
                    default: agent
                    type: string
                    enum:
                      - agent
                      - code
                  run_name:
                    type: string
                  job_name:
                    type:
                      - string
                      - "null"
                  destination_url:
                    type:
                      - string
                      - "null"
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  started_at:
                    type:
                      - string
                      - "null"
                  artifact_state:
                    type: string
                    enum:
