  /api/v1/runs/{runId}/retry-launch:
    post:
      summary: Manually retry a blocked launch
      description: |-
        Retries a blocked launch with its original immutable credential and API scope snapshot. Trigger edits affect future runs; revoked/deleted selections require trigger repair and a new run. An interactive owner must request this retry.

