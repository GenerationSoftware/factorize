  /api/v1/search:
    get:
      summary: Search jobs and runs by approximate metadata matches
      description: |-
        Search uses PostgreSQL pg_trgm approximate matching over job names/slugs and run names, issue titles, and issue identifiers. Identifier matching is whole-field trigram matching; names and titles use word-level trigram matching. Exact identifiers and metadata names rank first, followed by the strongest individual field score. Results are unique, tenant-scoped, deterministically ordered, and limited to 100. Blank or punctuation-only queries return no results. One- and two-character queries may return no results because trigram matching is approximate; this is not ordered-character or substring matching.

        Requires the jobs:read and runs:read scopes.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum:
                            - job
                            - run
                            - trace
                        id:
                          type: string
                        title:
                          type: string
                        subtitle:
                          type: string
                        url:
                          type: string
                        source:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                                - job
                                - run
                                - trace
                            label:
                              type: string
                            id:
                              type: string
                          required:
                            - kind
                            - label
                            - id
                          additionalProperties: false
                        match:
                          type: object
                          properties:
                            text:
                              type: string
                            ranges:
                              type: array
                              items:
                                type: object
                                properties:
                                  start:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                  end:
                                    type: integer
                                    minimum: 0
                                    maximum: 9007199254740991
                                required:
                                  - start
                                  - end
                                additionalProperties: false
                          required:
                            - text
                            - ranges
                          additionalProperties: false
                      required:
                        - kind
                        - id
                        - title
                        - subtitle
                        - url
                        - source
                        - match
                      additionalProperties: false
                required:
                  - items
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      operationId: get_api_v1_search
      tags:
        - search
      security:
        - bearerAuth: []
        - vendorRunIdentity: []
          runIdentityHeader: []
        - cookieAuth: []
      x-required-scope: jobs:read+runs:read
      x-owner-session-required: false
      parameters:
        - name: q
          in: query
          required: false
          schema:
            default: ""
            type: string
