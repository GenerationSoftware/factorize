  /api/v1/runs/{runId}/trace/replay:
    post:
      summary: Replay a retained trace artifact or restore a native-session projection
      description: |-
        Requires runs:cancel and an interactive tenant owner session. One terminal run per request, limited to 10 attempts per tenant per minute including retries and failures. Projection and result commit atomically; no artifacts are deleted. Retry failed requests with the same requestId. Conflicting reuse is rejected. Missing bytes cannot be recovered. Does not change the source declaration of an active or future run.

        Requires the runs:cancel scope.

        An interactive owner session is required; bearer tokens cannot call this operation.
      responses:
        "200":
          description: Durable replay result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceReplayResult"
        "400":
          $ref: "#/components/responses/Error400"
          description: Invalid request
        "401":
          $ref: "#/components/responses/Error401"
          description: Invalid owner session
        "403":
          $ref: "#/components/responses/Error403"
          description: Missing runs:cancel scope or interactive owner session
        "404":
          $ref: "#/components/responses/Error404"
          description: Run not found within the tenant
        "409":
          $ref: "#/components/responses/Error409"
          description: Request ID conflict or artifact ownership/checksum mismatch
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
          description: Tenant rate limit reached; wait one minute before retrying
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
          description: Artifact storage unavailable
      operationId: post_api_v1_runs_runId_trace_replay
      tags:
        - runs
      security:
        - cookieAuth: []
      x-required-scope: runs:cancel
      x-owner-session-required: true
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceReplayRequest"
