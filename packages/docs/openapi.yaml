  /api/v1/projects/{projectId}/graph:
    get:
      summary: Get a project's workflow graph
      description: |-
        Returns every job in the project and configured lifecycle, idle, manual invocation permission, and external webhook source connections. Connections are derived from executable trigger configuration and current permission grants. Webhook edge labels are short readable provider or event names; details may include configured technical resource identifiers as secondary context.

        Requires the projects:read scope.

        Accepts a scoped bearer token, vendor-verified run identity, or interactive owner session.
      responses:
        "200":
          description: Complete project graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - job
                            - webhook
                        label:
                          type: string
                        jobKind:
                          type: string
                          enum:
                            - Agent
                            - Code
                        enabled:
                          type: boolean
                        runningCount:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        concurrencyLimit:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        provider:
                          type: string
                        resource:
                          type: string
                      required:
                        - id
                        - type
                        - label
                      additionalProperties: false
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                        target:
                          type: string
                        label:
                          type: string
                        details:
                          type: string
                        kind:
                          type: string
                          enum:
                            - lifecycle
                            - idle
                            - manual
                            - webhook
                        enabled:
                          type: boolean
                      required:
                        - id
                        - source
                        - target
                        - label
                        - kind
                        - enabled
                      additionalProperties: false
                required:
                  - nodes
                  - edges
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
